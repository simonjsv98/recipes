<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 640" font-family="-apple-system, 'Google Sans', 'Helvetica Neue', Arial, sans-serif">
<title>Skärschema: 2 kouign amann och 6 croissanter</title>
<rect x="0" y="0" width="380" height="640" rx="12" fill="#FFFFFF"/>
<text x="40" y="36" font-size="14" font-weight="500" fill="#2C2C2A">1 · Dela plattan efter brevvikningen</text>
<rect x="40" y="52" width="36" height="120" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<rect x="76" y="52" width="84" height="120" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="58" y="116" font-size="12" fill="#633806" text-anchor="middle">KA</text>
<text x="118" y="116" font-size="12" fill="#444441" text-anchor="middle">Cro</text>
<text x="58" y="190" font-size="12" fill="#5F5E5A" text-anchor="middle">6</text>
<text x="118" y="190" font-size="12" fill="#5F5E5A" text-anchor="middle">14 cm</text>
<text x="180" y="88" font-size="12" fill="#444441">Plattan: ca 20 × 20 cm</text>
<text x="180" y="110" font-size="12" fill="#444441">KA-bit: 6 × 20 cm</text>
<text x="180" y="132" font-size="12" fill="#444441">Cro-bit: 14 × 20 cm</text>
<text x="180" y="154" font-size="12" fill="#444441">Skär innan du valsar</text>
<text x="40" y="232" font-size="14" font-weight="500" fill="#2C2C2A">2 · KA-biten: valsa till 6 × 40 cm, 8 mm</text>
<rect x="40" y="246" width="300" height="22.5" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<rect x="40" y="268.5" width="300" height="22.5" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="190" y="261.5" font-size="12" fill="#633806" text-anchor="middle">KA 1 · 3 × 40 cm</text>
<text x="190" y="284" font-size="12" fill="#633806" text-anchor="middle">KA 2 · 3 × 40 cm</text>
<text x="40" y="340" font-size="14" font-weight="500" fill="#2C2C2A">3 · Cro-biten: valsa till 30 × 30 cm, 5 mm</text>
<rect x="40" y="354" width="225" height="225" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<g stroke="#5F5E5A" stroke-width="1">
<line x1="115" y1="354" x2="115" y2="579"/><line x1="190" y1="354" x2="190" y2="579"/>
</g>
<g stroke="#2C2C2A" stroke-width="1" stroke-dasharray="4 3">
<line x1="40" y1="579" x2="115" y2="354"/><line x1="115" y1="579" x2="190" y2="354"/><line x1="190" y1="579" x2="265" y2="354"/>
</g>
<g stroke="#D85A30" stroke-width="2" stroke-linecap="round">
<line x1="77.5" y1="354" x2="77.5" y2="367"/><line x1="152.5" y1="354" x2="152.5" y2="367"/><line x1="227.5" y1="354" x2="227.5" y2="367"/>
<line x1="77.5" y1="579" x2="77.5" y2="566"/><line x1="152.5" y1="579" x2="152.5" y2="566"/><line x1="227.5" y1="579" x2="227.5" y2="566"/>
</g>
<g font-size="14" font-weight="500" fill="#444441" text-anchor="middle">
<text x="65" y="434">1</text><text x="90" y="509">2</text><text x="140" y="434">3</text>
<text x="165" y="509">4</text><text x="215" y="434">5</text><text x="240" y="509">6</text>
</g>
<text x="275" y="420" font-size="12" fill="#5F5E5A">30 cm</text>
<text x="275" y="446" font-size="12" fill="#5F5E5A">3 bitar</text>
<text x="275" y="466" font-size="12" fill="#5F5E5A">10 × 30 cm</text>
<text x="40" y="604" font-size="12" fill="#5F5E5A">Streckat: diagonal hörn till hörn</text>
<text x="40" y="624" font-size="12" fill="#D85A30">Rött: snitt 1,5–2 cm mitt i basen</text>
</svg>
