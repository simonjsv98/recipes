<style>
/* Kitchen planner: a simplified 3D model of the kitchen. Tap a drawer, door or surface to see what is in it,
   add things and plan where they should go. "Nu" is where things are today, "Plan" where they should be,
   and "Flyttlista" lists every move between the two. Saved in this browser. */
:root { --bg: #F3F2EF; --surface: #FBFAF8; --ink: #1B1A18; --muted: #7A776F; --line: #DEDCD6; --accent: #4A2212; --hi: #E63B1F; --display: "Google Sans", system-ui, sans-serif; }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.4 var(--display); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
[hidden] { display: none !important; }
.bar { position: fixed; z-index: 5; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; display: flex; align-items: center; gap: 10px; background: var(--bg); border-bottom: 1px solid var(--line); }
.back { font-weight: 500; white-space: nowrap; color: var(--ink); text-decoration: none; }
.title { flex: 1; font-weight: 600; font-size: 1.1rem; }
.modes { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 62px); display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 3px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
.modes button { padding: 7px 14px; border-radius: 18px; font-size: .92rem; font-weight: 500; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--accent); color: #F9E27D; }
.places { position: fixed; z-index: 5; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 112px); display: flex; flex-direction: column; gap: 6px; }
.places button { padding: 6px 12px; border-radius: 14px; font-size: .82rem; background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
#view { position: fixed; inset: 0; touch-action: none; }
.hint { position: fixed; z-index: 4; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); text-align: center; font-size: .85rem; color: var(--muted); pointer-events: none; }
.sheet { position: fixed; z-index: 6; left: 0; right: 0; bottom: 0; max-height: 62%; display: flex; flex-direction: column; background: var(--surface); border-radius: 16px 16px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,.12); padding: 14px 16px calc(env(safe-area-inset-bottom, 0px) + 14px); animation: up .25s ease-out; }
@keyframes up { from { transform: translateY(100%); } }
.sheet-head { display: flex; align-items: baseline; gap: 10px; }
.sheet-head h2 { flex: 1; font-size: 1.15rem; font-weight: 600; }
.sheet-head .sub { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.close { width: 36px; height: 36px; border-radius: 18px; background: var(--bg); font-size: 1.2rem; line-height: 1; }
.list { overflow-y: auto; margin-top: 10px; -webkit-overflow-scrolling: touch; }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .name { flex: 1; }
.item .moved { font-size: .78rem; color: var(--hi); }
.item select { font: inherit; font-size: .85rem; padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); max-width: 46%; }
.item .del { color: var(--muted); font-size: 1.1rem; padding: 4px 6px; }
.empty { color: var(--muted); padding: 10px 0; font-size: .95rem; }
.add { display: flex; gap: 8px; margin-top: 10px; }
.add input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.add button { padding: 0 16px; border-radius: 12px; background: var(--accent); color: #F9E27D; font-weight: 500; }
.moves .item { align-items: flex-start; }
.moves input[type=checkbox] { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); }
.moves .what { font-weight: 500; }
.moves .route { font-size: .85rem; color: var(--muted); }
.tools { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.tools button { padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; font-size: .88rem; background: var(--bg); }
.toast { position: fixed; z-index: 9; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 12px; font-size: .9rem; }
</style>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/* ---------- The kitchen, in cm, left to right along the wall (x), up (y) and out from the wall (z). ---------- */
const BASE_H = 86, PLINTH = 10, TOP = 4, DEPTH = 60, UP_Y = 145, UP_H = 72, UP_D = 35, TALL_H = 222;
const ZONES = []; // {id, name, group}
const zone = (id, name, group) => { ZONES.push({ id, name, group }); return id; };

// Storage zones. Names follow how you would say it in the kitchen.
const Z = {
  hyllor:   zone("hyllor",   "Öppna hyllor vid fönstret", "Högskåpet"),
  hog:      zone("hog",      "Högskåpet", "Högskåpet"),
  smal1:    zone("smal1",    "Smala lådan vänster, övre", "Vid spisen"),
  smal2:    zone("smal2",    "Smala lådan vänster, nedre", "Vid spisen"),
  ugnlada:  zone("ugnlada",  "Lådan under ugnen", "Vid spisen"),
  spis1:    zone("spis1",    "Breda lådan höger om ugnen, övre", "Vid spisen"),
  spis2:    zone("spis2",    "Breda lådan höger om ugnen, nedre", "Vid spisen"),
  disk1:    zone("disk1",    "Under diskhon, övre", "Vid diskhon"),
  disk2:    zone("disk2",    "Under diskhon, nedre", "Vid diskhon"),
  mitt1:    zone("mitt1",    "Mittenlådan, övre", "Vid diskhon"),
  mitt2:    zone("mitt2",    "Mittenlådan, nedre", "Vid diskhon"),
  kaffe1:   zone("kaffe1",   "Lådan vid kaffet, övre", "Vid kaffet"),
  kaffe2:   zone("kaffe2",   "Lådan vid kaffet, nedre", "Vid kaffet"),
  over1:    zone("over1",    "Överskåpet vid fläkten", "Överskåp"),
  over2:    zone("over2",    "Dubbla överskåpet", "Överskåp"),
  ovanpa:   zone("ovanpa",   "Ovanpå överskåpen", "Överskåp"),
  vagghylla:zone("vagghylla","Vägghyllan", "Väggen"),
  knivlist: zone("knivlist", "Knivlisten", "Väggen"),
  bankspis: zone("bankspis", "Bänken vid spisen", "Bänken"),
  bankdisk: zone("bankdisk", "Bänken vid diskhon", "Bänken"),
  bankkaffe:zone("bankkaffe","Bänken vid kaffet", "Bänken"),
  vinkyl:   zone("vinkyl",   "Vinkylen", "Hörnet"),
  vitskap:  zone("vitskap",  "Smala vita skåpet i hörnet", "Hörnet"),
  bankhorn: zone("bankhorn", "Träskivan över vinkylen", "Hörnet"),
  ovanrofco:zone("ovanrofco","Ovanpå Rofcon", "Vagnarna"),
  rofco:    zone("rofco",    "Rofco-ugnen", "Vagnarna"),
  rofcoskap:zone("rofcoskap","Skåpet under Rofcon", "Vagnarna"),
  vagn1:    zone("vagn1",    "Trävagnen, övre hyllan", "Vagnarna"),
  vagn2:    zone("vagn2",    "Trävagnen, nedre hyllan", "Vagnarna"),
};

// What the photos show today. The rest is filled in as more photos come.
const SEED = [
  ["Kokböcker", Z.hyllor], ["Karaff och glas", Z.hyllor], ["Liten mortel", Z.hyllor], ["Prydnadsföremål", Z.hyllor],
  ["Dricksglas", Z.over1], ["Termos och flaskor", Z.over1], ["Glasburkar", Z.over1], ["Trälåda", Z.over1], ["Vit förvaringslåda", Z.over1],
  ["Kastruller och kopparpannor", Z.ovanpa], ["Stor skål", Z.ovanpa],
  ["Espressokanna (Alessi)", Z.vagghylla], ["Kopparformar", Z.vagghylla], ["Stor mortel", Z.vagghylla], ["Durkslag", Z.vagghylla],
  ["Lerkrukor", Z.vagghylla], ["Skulptur", Z.vagghylla], ["Skärbrädor", Z.vagghylla], ["Degtråg", Z.vagghylla], ["Pizzaspade", Z.vagghylla],
  ["Knivar", Z.knivlist],
  ["Mjölburk", Z.bankspis], ["Hushållspapper", Z.bankspis], ["Pepparkvarn", Z.bankspis], ["Redskap i kruka", Z.bankspis],
  ["Handtvål", Z.bankdisk], ["Diskmedel", Z.bankdisk], ["Diskborste", Z.bankdisk],
  ["Kaffebryggare", Z.bankkaffe], ["Vitamix", Z.bankkaffe], ["Kaffepaket", Z.bankkaffe],
  ["Glasflaskor med patentlock", Z.bankhorn], ["Bricka", Z.bankhorn], ["Matlåda", Z.bankhorn], ["Små plastburkar", Z.bankhorn],
  ["Springform", Z.bankhorn], ["Påsar med torrvaror", Z.bankhorn], ["Svart låda", Z.bankhorn],
  ["Vin", Z.vinkyl],
  ["Rofco brödugn", Z.rofco], ["Bricka med papper", Z.ovanrofco], ["Tryckkokare", Z.rofcoskap],
  ["Vit förvaringslåda", Z.vagn1], ["Brödlåda i metall", Z.vagn1], ["Ankarsrum", Z.vagn2], ["Kastruller och formar", Z.vagn2],
];

/* ---------- State, saved in this browser ---------- */
const KEY = "kok-v1";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch(e) { return null; } };
let state = load() || { items: SEED.map(([name, z], i) => ({ id: "i" + i, name, now: z, plan: z, done: false })) };
// Things added to the starting list later reach a saved kitchen too, without touching what is already there.
for (const [name, z] of SEED) if (!state.items.some(it => it.name === name)) state.items.push({ id: "s" + name.replace(/\W/g, ""), name, now: z, plan: z, done: false });
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };
let mode = "nu";
const where = it => mode === "plan" ? it.plan : it.now;

/* ---------- Scene ---------- */
const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#F3F2EF");
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 5000);
// Step back far enough that the whole run, about 485 cm, fits the screen width, also on a phone held upright.
const KC = [242, 120, 20]; // middle of the kitchen
function frame() {
  const vfov = camera.fov * Math.PI / 180, hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
  const d = Math.max(262 / Math.tan(hfov / 2), 170 / Math.tan(vfov / 2));
  camera.position.set(KC[0] - d * .25, 150 + d * .22, 20 + d);
}
frame();
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(...KC);
controls.enableDamping = true;
controls.minDistance = 80; controls.maxDistance = 2600;
controls.maxPolarAngle = Math.PI * 0.55;
controls.update();

scene.add(new THREE.HemisphereLight("#ffffff", "#d8cfc2", 1.6));
const sun = new THREE.DirectionalLight("#fff4e6", 1.6);
sun.position.set(-150, 400, 500); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -450, right: 650, top: 600, bottom: -350, near: 10, far: 2000 });
scene.add(sun);

const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: .85 });
const M = {
  front: mat("#D9DAD2"), body: mat("#CFD0C7"), stone: new THREE.MeshStandardMaterial({ color: "#B8AE9F", roughness: .5 }),
  wall: mat("#F4F1EC"), floor: mat("#D9C3A3"), black: new THREE.MeshStandardMaterial({ color: "#1d1d1d", roughness: .35 }),
  steel: new THREE.MeshStandardMaterial({ color: "#c9cbcd", roughness: .3, metalness: .7 }), shelf: mat("#F7F5F0"),
  wood: mat("#C79F70"), glass: new THREE.MeshStandardMaterial({ color: "#2c3237", roughness: .15, metalness: .3 }),
};
let root = scene; // where box() and surface() put things; the kitchen is built in its own group
const box = (w, h, d, m, x, y, z, parent = root) => {
  const g = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  g.position.set(x + w / 2, y + h / 2, z + d / 2); g.castShadow = g.receiveShadow = true; parent.add(g); return g;
};

/* ---------- The room, measured from Simon's LiDAR scan ----------
   x runs along the kitchen from the balcony wall (−68) to the low wall under the slope (485),
   z from the kitchen wall (0) across the room to the TV wall (428). The corner with the carts
   reaches a bit further, to 483, and the doorway to the hall is in its far wall.
   The ceiling is 287 cm in the middle and slopes down to 200 at the balcony and to 97 at the low wall.
   From the scan's metres to these cm: x = 485 + (scanZ − 2.58) · 100, z = (2.38 − scanX) · 100. */
const ROOM = { x0: -68, x1: 485, tv: 428, corner: 483, hallX: [277, 377] };
const ceil = x => x < 77 ? 200 + (x - ROOM.x0) * 87 / 145 : x < 179 ? 287 : 287 - (x - 179) * .62;
// A wall seen from the side: a shape from x0 to x1 that follows the ceiling.
function profile(x0, x1, top = ceil) {
  const sh = new THREE.Shape(); sh.moveTo(x0, 0); sh.lineTo(x1, 0);
  for (const x of [x1, ...[179, 77].filter(b => b > x0 && b < x1), x0]) sh.lineTo(x, top(x));
  sh.closePath(); return sh;
}
const slab = (sh, m, z) => { const g = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: 4, bevelEnabled: false }), m); g.position.z = z; g.castShadow = g.receiveShadow = true; scene.add(g); return g; };
// Walls between the camera and the room are hidden, as in a doll's house.
const sides = []; // {meshes, at: point on the wall, out: normal pointing out of the room}
const side = (out, at, ...meshes) => sides.push({ out: new THREE.Vector3(...out), at: new THREE.Vector3(...at), meshes });
function hideWalls() {
  const v = new THREE.Vector3();
  for (const w of sides) { const show = v.copy(camera.position).sub(w.at).dot(w.out) < 0; for (const m of w.meshes) m.visible = show; }
}

box(ROOM.x1 - ROOM.x0, 2, ROOM.tv, M.floor, ROOM.x0, -2, 0);
box(ROOM.x1 - ROOM.hallX[0], 2, ROOM.corner - ROOM.tv, M.floor, ROOM.hallX[0], -2, ROOM.tv);
box(ROOM.hallX[1] - ROOM.hallX[0], 2, 110, mat("#B49C80"), ROOM.hallX[0], -2.4, ROOM.corner); // hall floor through the doorway
// the kitchen wall
slab(profile(ROOM.x0, ROOM.x1), M.wall, -4);
// balcony wall with the door and a window
const glassBlue = new THREE.MeshStandardMaterial({ color: "#2f4a66", roughness: .15, metalness: .2 });
side([-1, 0, 0], [ROOM.x0, 0, 0],
  box(4, 200, ROOM.tv, M.wall, ROOM.x0 - 4, 0, 0),
  box(1, 200, 90, mat("#E7E2D9"), ROOM.x0, 0, 85), box(1.6, 188, 78, glassBlue, ROOM.x0, 6, 91),
  box(1.6, 80, 90, glassBlue, ROOM.x0, 95, 285));
// the low wall under the slope, behind the sofa and the carts
side([1, 0, 0], [ROOM.x1, 0, 0], box(4, ceil(ROOM.x1), ROOM.corner, M.wall, ROOM.x1, 0, 0));
// TV wall, ending where the corner by the carts begins
const tvWall = slab(profile(ROOM.x0, ROOM.hallX[0] - 5), M.wall, ROOM.tv);
side([0, 0, 1], [0, 0, ROOM.tv], tvWall, box(4, ceil(ROOM.hallX[0] - 5), ROOM.corner - ROOM.tv, M.wall, ROOM.hallX[0] - 9, 0, ROOM.tv));
// far wall of the corner: the doorway to the hall, then the wall behind the white cart
const doorTop = x => Math.min(205, ceil(x));
const cornerWall = slab(profile(ROOM.hallX[1], ROOM.x1), M.wall, ROOM.corner);
const frameM = mat("#E7E2D9");
side([0, 0, 1], [0, 0, ROOM.corner], cornerWall,
  box(4, doorTop(ROOM.hallX[0]), 6, frameM, ROOM.hallX[0], 0, ROOM.corner - 1),
  box(4, doorTop(ROOM.hallX[1]), 6, frameM, ROOM.hallX[1] - 4, 0, ROOM.corner - 1));
// the sloping ceilings, hidden when the camera is above them
function quad(pts, m) {
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pts.flat(), 3));
  g.setIndex([0, 1, 2, 0, 2, 3]); g.computeVertexNormals();
  const q = new THREE.Mesh(g, m); q.receiveShadow = true; scene.add(q); return q;
}
const roofM = new THREE.MeshStandardMaterial({ color: "#F4F1EC", emissive: "#77726b", roughness: .9, side: THREE.DoubleSide });
function roof(xa, xb, z0, z1) {
  const ya = ceil(xa), yb = ceil(xb), up = new THREE.Vector3(-(yb - ya), xb - xa, 0).normalize();
  if (up.y < 0) up.negate();
  const q = quad([[xa, ya, z0], [xb, yb, z0], [xb, yb, z1], [xa, ya, z1]], roofM);
  side([up.x, up.y, up.z], [xa, ya, 0], q); return q;
}
roof(179, ROOM.x1, 0, ROOM.corner);
roof(ROOM.x0, 77, 0, ROOM.tv);
// a roof window over the sofa, as in the photos
{ const xa = 360, xb = 430, d = -1.5; side([.53, .85, 0], [xa, ceil(xa), 0], quad([[xa, ceil(xa) + d, 240], [xb, ceil(xb) + d, 240], [xb, ceil(xb) + d, 310], [xa, ceil(xa) + d, 310]], new THREE.MeshStandardMaterial({ color: "#2f4a66", side: THREE.DoubleSide }))); }

// Living room, only for orientation. The sofa has its back to the low wall and faces the balcony.
const sofaM = mat("#E9E4DA");
box(102, 42, 150, sofaM, 341, 0, 206); box(24, 78, 150, sofaM, 419, 0, 206);
box(80, 60, 16, sofaM, 341, 0, 206); box(80, 60, 16, sofaM, 341, 0, 340);
box(63, 46, 118, mat("#DCD6CC"), 270, 0, 180); // marble coffee table
// TV on a low sideboard against the TV wall, and the floor lamp by the doorway
// (hidden with the TV wall, so they do not stand in the way when looking at the kitchen)
{ const l = new THREE.Mesh(new THREE.CylinderGeometry(9, 14, 20, 20, 1, true), new THREE.MeshStandardMaterial({ color: "#f1c48a", emissive: "#a8631a", emissiveIntensity: .35, side: THREE.DoubleSide })); l.position.set(243.5, 128, 413.5); scene.add(l);
  sides.find(w => w.meshes.includes(tvWall)).meshes.push(l,
    box(160, 62, 35, mat("#ECE9E2"), 77, 0, 393),
    box(122, 70, 5, mat("#1d1d1d"), 96, 90, 420), box(4, 28, 4, mat("#1d1d1d"), 155, 62, 421),
    box(3, 120, 3, mat("#6b5a45"), 242, 0, 412)); }
// dining table by the balcony with four chairs and the big fabric lamp
box(180, 4, 90, mat("#C99B68"), 5, 72, 205);
for (const [x, z] of [[9, 209], [177, 209], [9, 287], [177, 287]]) box(4, 72, 4, mat("#A87C4F"), x, 0, z);
for (const [x, z, f] of [[35, 160, 1], [115, 160, 1], [35, 300, -1], [115, 300, -1]]) {
  box(42, 3, 40, mat("#2a2a2a"), x, 44, z);
  box(42, 34, 3, mat("#2a2a2a"), x, 50, f > 0 ? z : z + 37);
  for (const dx of [0, 39]) box(2, 44, 2, M.steel, x + dx, 0, z + 19);
}
{ const shade = new THREE.Mesh(new THREE.CylinderGeometry(16, 34, 24, 28, 1, true), new THREE.MeshStandardMaterial({ color: "#d6cfc4", emissive: "#6b5a40", emissiveIntensity: .25, side: THREE.DoubleSide, roughness: 1 })); shade.position.set(95, 178, 250); scene.add(shade);
  box(.6, 95, .6, mat("#888"), 95, 190, 250); }

const pickables = []; // meshes that open a zone
const movers = [];    // {mesh, kind, open: fn}
function front(zoneId, w, h, x, y, kind = "drawer", hinge = "left") {
  // kind: drawer (slides out) or door (swings on its hinge)
  const pivot = new THREE.Group();
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w - 0.6, h - 0.6, 2), M.front.clone());
  mesh.castShadow = mesh.receiveShadow = true;
  const handle = new THREE.Mesh(new THREE.BoxGeometry(5, 1.2, 1.6), M.steel);
  if (kind === "door") {
    pivot.position.set(hinge === "left" ? x : x + w, y, 0);
    mesh.position.set((hinge === "left" ? 1 : -1) * w / 2, h / 2, 1);
    handle.position.set((hinge === "left" ? 1 : -1) * (w - 4), 8, 2.6);
  } else {
    pivot.position.set(x, y, 0);
    mesh.position.set(w / 2, h / 2, 1);
    handle.position.set(w / 2, h - 5, 2.6);
  }
  pivot.add(mesh); pivot.add(handle);
  mesh.userData.zone = zoneId; handle.userData.zone = zoneId;
  pickables.push(mesh, handle);
  movers.push({ zone: zoneId, pivot, kind, hinge, base: pivot.position.clone(), t: 0, target: 0, mesh });
  return pivot;
}
function surface(zoneId, w, d, x, y, z) {
  // an invisible hit area over a counter or shelf, highlighted when chosen
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, 1, d), new THREE.MeshBasicMaterial({ color: "#E63B1F", transparent: true, opacity: 0 }));
  m.position.set(x + w / 2, y + 0.6, z + d / 2); m.userData.zone = zoneId; m.userData.surface = true;
  root.add(m); pickables.push(m); return m;
}

/* The kitchen is drawn unit by unit at the widths read from the photos, then squeezed along the wall to the
   length the scan measured (485 cm from the open shelves to the low wall). */
const K = new THREE.Group(); K.scale.x = 485 / 530; scene.add(K); root = K;
// Base run. Each unit is a carcass on a plinth; fronts sit at z = DEPTH.
const base = new THREE.Group(); base.position.z = DEPTH; K.add(base);
const carcass = (x, w) => box(w, BASE_H - PLINTH - TOP, DEPTH - 2, M.body, x, PLINTH, 0);
const plinth = (x, w) => box(w, PLINTH, DEPTH - 6, M.body, x, 0, 0);
const twoDrawers = (x, w, a, b) => {
  carcass(x, w); plinth(x, w);
  const h = (BASE_H - PLINTH - TOP) / 2;
  base.add(front(b, w, h, x, PLINTH)); base.add(front(a, w, h, x, PLINTH + h));
};
// Open shelves at the window end, the tall cabinet, then the run to the wine fridge.
box(30, TALL_H, DEPTH, M.body, 0, 0, 0);
for (let i = 0; i < 6; i++) box(28, 1.6, DEPTH - 4, M.shelf, 1, 12 + i * 38, 2);
surface(Z.hyllor, 30, DEPTH, 0, 100, 0);
box(60, TALL_H, DEPTH - 2, M.body, 30, 0, 0);
base.add(front(Z.hog, 60, TALL_H - PLINTH, 30, PLINTH, "door", "left"));
twoDrawers(90, 40, Z.smal1, Z.smal2);
// oven with its drawer, hob above
box(60, BASE_H - TOP, DEPTH - 2, M.body, 130, 0, 0);
box(58, 56, 2, M.black, 131, 28, DEPTH - 1);
box(46, 2, 2, M.steel, 137, 76, DEPTH + 1.5);
base.add(front(Z.ugnlada, 60, 18, 130, PLINTH));
twoDrawers(190, 80, Z.spis1, Z.spis2);
twoDrawers(270, 60, Z.disk1, Z.disk2);
twoDrawers(330, 60, Z.mitt1, Z.mitt2);
twoDrawers(390, 40, Z.kaffe1, Z.kaffe2);
// The corner: a wine fridge with a steel frame and glass door, then a narrow white cabinet, under one wooden top.
box(60, BASE_H - TOP - 2, DEPTH - 2, M.black, 432, 0, 0);
box(58, 80, 1.5, M.steel, 433, 2, DEPTH - 1);
const wine = box(46, 66, 1, M.glass, 439, 8, DEPTH + .6); wine.userData.zone = Z.vinkyl; pickables.push(wine);
box(1.6, 50, 2.4, M.steel, 436, 18, DEPTH + 1);
box(36, BASE_H - TOP - 2, DEPTH - 2, M.body, 494, 0, 0);
base.add(front(Z.vitskap, 36, BASE_H - TOP - 4, 494, 2, "door", "right"));
movers[movers.length - 1].mesh.material.color.set("#F2F1EC"); // this one is a plain white door
box(100, 3, DEPTH + 2, M.wood, 430, BASE_H - TOP - 2, 0);
surface(Z.bankhorn, 100, DEPTH, 430, BASE_H - 2, 0);
// stone counter with sink and hob
box(340, TOP, DEPTH + 2, M.stone, 90, BASE_H - TOP, 0);
box(60, 0.6, 50, M.black, 132, BASE_H + 0.1, 5);
box(42, 0.8, 38, M.steel, 279, BASE_H - 0.2, 10);
surface(Z.bankspis, 140, DEPTH, 90, BASE_H, 0);
surface(Z.bankdisk, 120, DEPTH, 230, BASE_H, 0);
surface(Z.bankkaffe, 120, DEPTH, 350, BASE_H, 0);

// Upper cabinets over the hob, with the hood underneath the first one.
const upper = new THREE.Group(); upper.position.z = UP_D; K.add(upper);
box(60, UP_H, UP_D - 2, M.body, 130, UP_Y, 0);
box(140, UP_H, UP_D - 2, M.body, 190, UP_Y, 0);
upper.add(front(Z.over1, 60, UP_H, 130, UP_Y, "door", "left"));
upper.add(front(Z.over2, 70, UP_H, 190, UP_Y, "door", "left"));
upper.add(front(Z.over2, 70, UP_H, 260, UP_Y, "door", "right"));
box(58, 4, UP_D - 4, M.steel, 131, UP_Y - 4, 2);
surface(Z.ovanpa, 200, UP_D, 130, UP_Y + UP_H, 0);
// a few pans on top, as in the photos
for (const [x, c] of [[150, "#b87333"], [175, "#c9cbcd"], [205, "#b87333"]]) {
  const p = new THREE.Mesh(new THREE.CylinderGeometry(9, 9, 6, 24), mat(c)); p.position.set(x, UP_Y + UP_H + 3, 16); p.castShadow = true; K.add(p);
}

// Wall shelf and knife strip.
box(100, 2.4, 26, M.shelf, 332, 150, 0);
for (const x of [345, 415]) box(3, 22, 18, M.shelf, x, 128, 0);
surface(Z.vagghylla, 100, 26, 332, 152, 0);
box(32, 3, 2, M.wood, 94, 120, 0);
for (let i = 0; i < 6; i++) box(1.6, 18, 1, M.steel, 96 + i * 5, 112, 2);
const knives = box(34, 26, 6, new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 }), 93, 108, 0); knives.userData.zone = Z.knivlist; pickables.push(knives);

// Simple stand-ins for what stands on the counter today.
const prop = (w, h, d, c, x, z) => box(w, h, d, mat(c), x, BASE_H, z);
prop(14, 30, 16, "#1d1d1d", 395, 22);     // coffee maker
prop(16, 40, 18, "#262626", 412, 22);     // Vitamix
for (const x of [458, 468, 478]) { const b = new THREE.Mesh(new THREE.CylinderGeometry(3.5, 3.5, 28, 12), new THREE.MeshStandardMaterial({ color: "#dfe7e6", roughness: .1, transparent: true, opacity: .7 })); b.position.set(x, BASE_H + 13, 18); K.add(b); }
prop(24, 10, 14, "#e8dcc0", 432, 30); prop(26, 8, 12, "#222222", 500, 26);
prop(14, 24, 14, "#ffffff", 200, 10);      // flour jar
for (const x of [262, 268]) { const b = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 16, 12), mat("#5a2e12")); b.position.set(x, BASE_H + 8, 12); K.add(b); }
const tap = new THREE.Mesh(new THREE.TorusGeometry(8, 1.2, 8, 24, Math.PI), M.steel); tap.position.set(300, BASE_H + 22, 12); tap.rotation.y = Math.PI / 2; K.add(tap);
box(2.4, 22, 2.4, M.steel, 299, BASE_H, 11);
root = scene;

/* The two carts in the corner past the end of the sofa, seen from the dining table: the wooden cart against
   the low wall, partly behind the sofa's end, the white cart with the Rofco in front of it in the corner, and the
   doorway to the hall beside them. Both face the balcony. Each is built along its own x (its width) and z (out
   to its front), then turned so the front faces the room. */
const cart = (x, z) => { const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = -Math.PI / 2; scene.add(g); return g; };
const cboxIn = g => (w, h, d, m, x, y, z) => box(w, h, d, m, x, y, z, g);
const csurfaceIn = g => (zoneId, w, d, x, y, z) => { const m = surface(zoneId, w, d, x, y, z); scene.remove(m); g.add(m); return m; };
// wooden cart: open frame with two shelves and a top
const wood = cart(ROOM.x1 - 4, 312), wbox = cboxIn(wood), wsurf = csurfaceIn(wood);
for (const [x, z] of [[0, 0], [86, 0], [0, 36], [86, 36]]) wbox(4, 72, 4, M.wood, x, 4, z);
// the boards themselves open their shelf too, so a tap anywhere on them works
for (const [y, z] of [[14, Z.vagn2], [44, Z.vagn1], [72, Z.vagn1]]) { const b = wbox(90, 2.4, 40, M.wood, 0, y, 0); b.material = M.wood.clone(); b.userData.zone = z; pickables.push(b); }
wsurf(Z.vagn2, 90, 40, 0, 16, 0); wsurf(Z.vagn1, 90, 40, 0, 46, 0);
wbox(40, 18, 30, mat("#ffffff"), 6, 46.5, 4); wbox(26, 16, 22, M.steel, 52, 46.5, 8);
wbox(22, 26, 22, mat("#e9e6df"), 10, 16.5, 8); wbox(28, 18, 26, M.steel, 50, 16.5, 6);
// white cart: a tall white panel, then the Rofco on a low white cabinet, against the corner's far wall.
// It is taller than the low wall, so the slope keeps it about half a metre out from it.
const whiteCart = cart(431, ROOM.corner - 92), cbox = cboxIn(whiteCart), csurface = csurfaceIn(whiteCart);
const white = mat("#F2F1EC");
cbox(44, 100, 44, white, 0, 0, 0);
cbox(48, 60, 44, white, 44, 0, 0);
const rcDoor = new THREE.Group(); rcDoor.position.z = 44; whiteCart.add(rcDoor);
rcDoor.add(front(Z.rofcoskap, 48, 58, 44, 1, "door", "right"));
movers[movers.length - 1].mesh.material.color.set("#F2F1EC");
cbox(48, 40, 44, M.steel, 44, 60, 0);
const rofcoDoor = cbox(40, 24, 1.5, M.steel, 48, 63, 44); rofcoDoor.userData.zone = Z.rofco; pickables.push(rofcoDoor);
cbox(3, 14, 2, M.black, 51, 68, 45.5);
const win = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 1, 20), new THREE.MeshStandardMaterial({ color: "#f2b25b", emissive: "#a05a10", emissiveIntensity: .4 }));
win.rotation.x = Math.PI / 2; win.position.set(70, 75, 46); whiteCart.add(win);
cbox(48, 2, 44, M.black, 44, 100, 0);
csurface(Z.ovanrofco, 48, 44, 44, 101, 0);

/* ---------- Picking and opening ---------- */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let selected = null, downAt = null;
renderer.domElement.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return; // a drag, not a tap
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  if (hit) select(hit.object.userData.zone); else if (mode !== "moves") select(null);
});
// The place chips move the camera to the kitchen or to the carts.
// Each view looks at a target from a direction, far enough back that `half` cm on each side fits the screen.
const PLACES = { kok: { target: KC }, vagnar: { target: [420, 60, 400], dir: [-.55, .72, -.42], half: 150 }, allt: { target: [210, 0, 240], dir: [.46, .74, .49], half: 330 } };
let fly = null;
function goTo(name) {
  if (name === "kok") { frame(); aim = new THREE.Vector3(...PLACES.kok.target); return; }
  const p = PLACES[name], vfov = camera.fov * Math.PI / 180, hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
  const d = Math.max(p.half / Math.tan(hfov / 2), p.half * .8 / Math.tan(vfov / 2));
  aim = new THREE.Vector3(...p.target); fly = aim.clone().addScaledVector(new THREE.Vector3(...p.dir).normalize(), d);
}
// When a zone opens, the camera turns toward it and the picture moves up above the sheet.
let aim = null;
function select(id) {
  selected = id;
  const hitMesh = pickables.find(p => p.userData.zone === id);
  if (hitMesh) aim = hitMesh.getWorldPosition(new THREE.Vector3()); // closing keeps the view where it is
  for (const m of movers) m.target = m.zone === id ? 1 : 0;
  for (const p of pickables) {
    if (p.userData.surface) p.material.opacity = p.userData.zone === id ? .28 : 0;
    else if (p.material && p.material.emissive) p.material.emissive.set(p.userData.zone === id ? "#3a1608" : "#000000");
  }
  render();
}
const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(clock.getDelta(), .05);
  for (const m of movers) {
    m.t += (m.target - m.t) * Math.min(1, dt * 9);
    if (m.kind === "drawer") m.pivot.position.z = m.base.z + m.t * 32;
    else m.pivot.rotation.y = (m.hinge === "left" ? -1 : 1) * m.t * 1.7;
  }
  if (aim) { controls.target.lerp(aim, Math.min(1, dt * 4)); if (controls.target.distanceTo(aim) < .5) aim = null; }
  if (fly) { camera.position.lerp(fly, Math.min(1, dt * 4)); if (camera.position.distanceTo(fly) < 1) fly = null; }
  controls.update();
  hideWalls();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); frame(); renderer.setSize(innerWidth, innerHeight); });

/* ---------- Sheet: what is in a zone, and the list of moves ---------- */
const sheet = document.getElementById("sheet"), hint = document.getElementById("hint");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const zoneName = id => (ZONES.find(z => z.id === id) || {}).name || id;
const options = sel => ZONES.map(z => `<option value="${z.id}"${z.id === sel ? " selected" : ""}>${esc(z.name)}</option>`).join("");
function shiftView() {
  const sh = sheet.hidden ? 0 : sheet.offsetHeight;
  camera.setViewOffset(innerWidth, innerHeight, 0, sh * .45, innerWidth, innerHeight);
}
function render() {
  requestAnimationFrame(shiftView);
  hint.hidden = !!selected || mode === "moves";
  if (mode === "moves") return renderMoves();
  if (!selected) { sheet.hidden = true; return; }
  const z = ZONES.find(z => z.id === selected);
  const items = state.items.filter(it => where(it) === selected);
  sheet.hidden = false;
  sheet.innerHTML = `
    <div class="sheet-head"><h2>${esc(z.name)}</h2><span class="sub">${mode === "plan" ? "Plan" : "Nu"}</span><button class="close" data-close aria-label="Stäng">×</button></div>
    <div class="list">${items.length ? items.map(it => `
      <div class="item"><span class="name">${esc(it.name)}${mode === "plan" && it.now !== it.plan ? `<br><span class="moved">Flyttas hit från ${esc(zoneName(it.now))}</span>` : ""}</span>
        <select data-move="${it.id}" aria-label="Flytta ${esc(it.name)}">${options(where(it))}</select>
        <button class="del" data-del="${it.id}" aria-label="Ta bort">×</button></div>`).join("")
      : `<p class="empty">${mode === "plan" ? "Inget planerat här än." : "Inget inlagt här än. Lägg till det som finns, eller skicka en bild så fyller jag i."}</p>`}</div>
    <form class="add" data-add><input name="n" placeholder="Lägg till sak" autocomplete="off"><button>Lägg till</button></form>`;
}
function renderMoves() {
  const moves = state.items.filter(it => it.now !== it.plan || it.done);
  sheet.hidden = false;
  sheet.innerHTML = `
    <div class="sheet-head"><h2>Flyttlista</h2><span class="sub">${moves.filter(m => !m.done).length} kvar</span><button class="close" data-mode-nu aria-label="Stäng">×</button></div>
    <div class="list moves">${moves.length ? moves.map(it => `
      <label class="item"><input type="checkbox" data-done="${it.id}"${it.done ? " checked" : ""}>
        <span><span class="what">${esc(it.name)}</span><br><span class="route">${esc(zoneName(it.done ? it.from : it.now))} → ${esc(zoneName(it.plan))}</span></span></label>`).join("")
      : `<p class="empty">Inga flyttar än. Byt till Plan och flytta saker dit du vill ha dem.</p>`}</div>
    <div class="tools"><button data-export>Kopiera data</button><button data-reset>Börja om</button></div>`;
}
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 1800); }

document.addEventListener("click", async e => {
  const t = e.target.closest("button, [data-done]"); if (!t) return;
  if (t.dataset.place) { goTo(t.dataset.place); return; }
  if (t.dataset.mode) {
    mode = t.dataset.mode;
    document.querySelectorAll(".modes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
    if (mode === "moves") select(null); else render();
  }
  else if ("close" in t.dataset) select(null);
  else if ("modeNu" in t.dataset) document.querySelector('[data-mode="nu"]').click();
  else if (t.dataset.del) { state.items = state.items.filter(it => it.id !== t.dataset.del); save(); render(); }
  else if ("export" in t.dataset) { try { await navigator.clipboard.writeText(JSON.stringify(state)); toast("Kopierat. Klistra in i chatten."); } catch(err) { toast("Kunde inte kopiera"); } }
  else if ("reset" in t.dataset) { if (confirm("Börja om från bilderna? Allt du har ändrat försvinner.")) { localStorage.removeItem(KEY); location.reload(); } }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.move) {
    const it = state.items.find(i => i.id === t.dataset.move);
    if (mode === "plan") it.plan = t.value; else { const old = it.now; it.now = t.value; if (it.plan === old) it.plan = t.value; }
    save(); render(); toast(`${it.name} → ${zoneName(t.value)}`);
  }
  if (t.dataset.done) {
    const it = state.items.find(i => i.id === t.dataset.done);
    if (t.checked) { it.from = it.now; it.now = it.plan; it.done = true; } else { it.now = it.from || it.now; it.done = false; }
    save(); renderMoves();
  }
});
document.addEventListener("submit", e => {
  if (!e.target.matches("[data-add]")) return;
  e.preventDefault();
  const n = e.target.n.value.trim(); if (!n || !selected) return;
  state.items.push({ id: "u" + Date.now(), name: n, now: selected, plan: selected, done: false });
  save(); render();
  sheet.querySelector("input[name=n]").focus();
});
</script>
