<style>
/* Layout: one calm scrolling page per recipe, written like the Notion page. A fixed button brings up the ingredients from anywhere. */
:root {
  --bg: #F3F2EF; --surface: #FBFAF8; --ink: #1B1A18; --muted: #7A776F; --line: #DEDCD6; --accent: #1B1A18;
  --display: "Google Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --body: "Google Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
}
:root { color-scheme: light; }

* { box-sizing: border-box; }
html, body { height: 100%; }
html { background: var(--bg); }
#app { position: relative; z-index: 1; }
.search-panel { position: fixed; z-index: 15; left: 0; right: 0; top: env(safe-area-inset-top, 0px); bottom: 0; background: var(--bg); display: flex; flex-direction: column; }
.search-panel-head { display: flex; align-items: center; gap: 14px; padding-block: 10px; }
.search-panel-head .search { flex: 1; min-width: 0; margin: 0; }
.search-close { flex: none; min-height: 44px; font-weight: 500; }
.search-panel .scroll { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.45; overflow: hidden; }
button, a { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
h1, h2, p, ul, ol { margin: 0; padding: 0; list-style: none; }
.gutter { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 600px; margin-inline: auto; width: 100%; }
.view { height: 100%; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; }

/* Home */
.home-title { font: 500 1.9rem/1.2 var(--display); padding-block: 44px 32px; }
.section-label { margin-top: 32px; padding-bottom: 10px; }
.recipes button, .recipes a { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; width: 100%; padding-block: 16px; border-top: 1px solid var(--line); font-size: 1.15rem; line-height: 1.3; text-decoration: none; }
.recipes li:last-child > * { border-bottom: 1px solid var(--line); }
.recipes a { color: var(--muted); }
.recipes .mark { color: var(--muted); flex: none; }
.home-bottom { height: 40px; }
.search { display: block; width: 100%; min-height: 52px; padding: 0 16px; border: 1px solid var(--line); border-radius: 26px; background: var(--surface); color: var(--ink); font: inherit; font-size: 1.05rem; margin-bottom: 24px; outline: none; transition: border-color .16s; -webkit-appearance: none; appearance: none; }
.search::placeholder { color: var(--muted); }
.search:focus { border-color: var(--ink); }
.recipes .hit { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.recipes .where { font-size: .85rem; color: var(--muted); }
.no-hits { color: var(--muted); padding-block: 8px; }

/* Recipe */
.top { display: flex; align-items: center; justify-content: space-between; min-height: 56px; }
.top-bar { background: var(--bg); border-bottom: 1px solid var(--line); }
.top-bar .link { flex: 1; min-width: 0; color: var(--ink); font-weight: 500; }
.top-bar .link span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.nav-icons { display: flex; gap: 2px; flex: none; margin-right: -10px; }
.top-bar .top { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; }
.nav-icons { display: contents; }
[data-nav-search] { justify-self: end; margin-right: -10px; }
.icon-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--ink); }
.icon-btn svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.intro, .plan, .step .text, .note-line { white-space: pre-line; overflow-wrap: anywhere; }
.part-name { font-weight: 600; font-size: 1.05rem; padding-block: 18px 2px; }
.note-heading { font-weight: 600; margin-top: 18px; }
.note-line { margin-top: 8px; font-size: 1.05rem; }
.recipe-link { display: inline-block; font: inherit; font-weight: 600; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; padding-block: 4px; }
.link { min-height: 44px; display: flex; align-items: center; font-size: .95rem; color: var(--muted); }
.link.strong { color: var(--ink); font-weight: 600; }
.title { font: 500 clamp(1.7rem, 7.4vw, 2.3rem)/1.2 var(--display); text-wrap: balance; padding-top: 16px; }
.intro { color: var(--muted); margin-top: 14px; font-size: 1rem; }
.plan { color: var(--muted); margin-top: 10px; font-size: 1rem; }
.label { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.block-label { margin-top: 40px; padding-bottom: 8px; }
.group { margin-top: 20px; padding-bottom: 4px; }
.ing { display: grid; grid-template-columns: 6.2em minmax(0, 1fr); gap: 10px; padding-block: 9px; line-height: 1.35; }
.ing + .ing { border-top: 1px solid var(--line); }
.ing.noamt { grid-template-columns: minmax(0, 1fr); }
.ing .amt { font-weight: 600; font-variant-numeric: tabular-nums; }

.steps { display: flex; flex-direction: column; }
.step { display: grid; grid-template-columns: 1.7em minmax(0, 1fr); gap: 6px; padding-block: 22px; border-top: 1px solid var(--line); cursor: pointer; transition: opacity .15s; }
.step .no { font-size: .95rem; line-height: 1.9rem; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.step .text { font-size: clamp(1.2rem, 5.2vw, 1.45rem); line-height: 1.4; min-width: 0; }
.step .text b { font-weight: 600; color: var(--accent); }
.step.done { opacity: .32; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; border-top: 1px solid var(--line); padding-block: 12px 112px; }
.hint { color: var(--muted); font-size: .95rem; padding-bottom: 14px; }

/* Ingredients button: same spot opens and closes the list */
.ing-btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 60px; border-radius: 30px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 1.1rem; text-align: center; }
.ing-dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding-top: 12px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); pointer-events: none; }
.ing-dock .ing-btn { pointer-events: auto; }

/* Ingredient sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; background: rgba(10, 10, 8, .4); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 600px; max-height: 85%; border-radius: 14px 14px 0 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet .top { min-height: 60px; }
.sheet-title { font: 500 1.15rem/1.2 var(--display); }
.sheet .scroll { padding-bottom: 12px; }
.sheet-foot { padding-top: 12px; padding-bottom: 16px; }
.sheet .group:first-child { margin-top: 0; }

/* Motion: short, one curve, pages move in the direction you travel */
:root { --ease: cubic-bezier(.2, .8, .2, 1); }
/* Page changes: the new page replaces the old one at once, with a short fade. No sliding or overlapping pages, which stutter on phones. */
.top-bar { position: relative; z-index: 2; }
.settled, .settled * { animation: none !important; }
#app, #app * { touch-action: pan-y pinch-zoom; }
.enter-f > .scroll, .enter-b > .scroll { animation: page-in .16s ease-out; }
@keyframes page-in { from { opacity: 0; } }
/* Update: a colored circle grows from the button, and shrinks back into it once the new version has loaded. */
/* The circle moves by transform, which the phone animates without redrawing the page. The red hold covers the reload itself. */
.update-wipe { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #FFC9D6; font-size: 1.7rem; font-weight: 500; letter-spacing: .02em; }
.update-wipe b { position: absolute; border-radius: 50%; background: #E63B1F; will-change: transform; }
.update-wipe span { position: relative; }
html.wipe-hold::after { content: "RECIPES"; position: fixed; left: 0; right: 0; bottom: 0; top: var(--wipe-top, 0px); z-index: 29; background: #E63B1F; color: #FFC9D6; display: flex; align-items: center; justify-content: center; font: 500 1.7rem "Google Sans", -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .02em; }
.icon-btn.updating svg { animation: update-spin .8s linear infinite; }
@keyframes update-spin { to { transform: rotate(360deg); } }
/* Swipe back: the current page lifts off and follows the finger, the previous page waits underneath. */
.swipe-top { position: fixed; inset: 0; z-index: 5; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); will-change: transform; pointer-events: none; }
.swipe-top::before { content: ""; position: absolute; top: 0; bottom: 0; left: -14px; width: 14px; background: linear-gradient(to left, rgba(20, 18, 10, .14), transparent); }
#app.swiping { will-change: transform; }

.recipes button, .recipes a { transition: opacity .12s, padding-left .2s var(--ease); }
.recipes .mark { transition: transform .2s var(--ease); }
.recipes button:active, .recipes a:active { opacity: .45; }
.step:active .text { opacity: .6; }
.step .text { transition: opacity .12s; }
.ing-btn { transition: transform .16s var(--ease), opacity .16s; }
.ing-btn:active { transform: scale(.97); opacity: .88; }
@media (hover: hover) {
  .recipes button:hover .mark, .recipes a:hover .mark { transform: translateX(3px); }
}

.sheet-wrap { animation: fade-in .2s ease-out; }
.sheet { animation: sheet-in .32s var(--ease); }
.sheet-wrap.closing { animation: fade-out .2s ease-in forwards; }
.sheet-wrap.closing .sheet { animation: sheet-out .2s ease-in forwards; }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
@keyframes sheet-in { from { transform: translateY(100%); } }
@keyframes sheet-out { to { transform: translateY(100%); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
/* iOS 26 blurs the top edge of home screen apps unless a fixed, opaque, full-width element sits there. */
body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: max(env(safe-area-inset-top, 0px), 2px); background: #F3F2EF; z-index: 30; }
.top-bar { position: fixed !important; top: 0; left: 0; right: 0; padding-top: env(safe-area-inset-top, 0px); background: #F3F2EF; z-index: 2; }
.top-bar + .scroll { margin-top: 57px; }
.search-panel { top: 0 !important; padding-top: env(safe-area-inset-top, 0px); }
</style>

<style>
/* Start page: two full colour tiles, one per kitchen. */
.home-wordmark { font: 600 1.15rem/1 var(--display); letter-spacing: .04em; }
.home-scroll { display: flex; }
.home-tiles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding-block: 12px calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 900px; margin-inline: auto; }
.tile { position: relative; flex: 1; min-height: 240px; width: 100%; border-radius: 20px; overflow: hidden; transition: transform .16s var(--ease); }
.tile:active { transform: scale(.98); }
.tile svg { position: absolute; top: 3%; right: -4%; height: 78%; }
.tile-label { position: absolute; left: 20px; bottom: 16px; display: flex; flex-direction: column; text-align: left; }
.tile-name { font: 600 2.1rem/1.05 var(--display); letter-spacing: .01em; }

@media (orientation: landscape) { .home-tiles { flex-direction: row; } }

[data-section="bake"] { --accent: #4A2212; --cover: #4A2212; --on-cover: #F9E27D; --dot: #F2C94C; }
[data-section] .home-title::after { content: ""; display: inline-block; width: .42em; height: .42em; margin-left: .3em; border-radius: 50%; background: var(--dot); vertical-align: .08em; }
[data-section] .home-title, [data-section] .section-label, [data-section] .recipes .mark, [data-section] .block-label { color: var(--accent); }
[data-section] .ing-btn { background: var(--cover); color: var(--on-cover); }
[data-section] .recipe-link { color: var(--accent); }
</style>

// Search: forgives typos and accents, finds words inside compounds, and understands food concepts through CONCEPTS.
// Aliases on the left match a recipe when one of its name, section or ingredient words contains a trigger on the right.
const CONCEPTS = [
  ["kött meat", "nöt färs köttgryta dillkött bolognese lamm fläsk pork vildsvin ribs revben pancetta korv saucisse pulled peposa rosmarinsgryta"],

  ["pasta", "carbonara bolognese lasagna maccheroni spaghetti pasta"],
  ["nudlar noodles", "pho noodle stir"],

  ["gryta stew", "gryta dal curry dillkött peposa butter lentilles bräser"],
  ["vegetariskt vegetarisk vego veg grönt", "pumpa grönkål portabello dal palak beans purjolök tomathalvor polenta vitkål gurksallad västerbottenpaj pea"],
  ["sallad salad", "sallad coleslaw"],
  ["dessert efterrätt sött sweet", "flan glass cream gelato sorbet kladdkaka pudding blåbärspaj äppelpaj blondies mugcake morotskaka lemon våfflor"],
  ["kaka cake tårta fika", "kladdkaka mugcake morotskaka blondies lemon bananbröd bullar"],
  ["glass icecream", "glass cream gelato sorbet"],
  ["choklad chocolate", "choklad kladdkaka chocochock"],
  ["bröd bread", "bröd brød frallor bullar baguette loaf pumpernickel tortillas"],
  ["paj pie", "paj quiche"],
  ["frukost breakfast", "chia fattiga porridge morgenbrød"],
  ["tillbehör sides", "potatismos gratäng gurksallad polenta tomathalvor vitkål coleslaw broccoli"],
  ["sås sauce dressing", "sås dressing aioli"],
  ["potatis potato", "potatis gratäng kroppkakor"],
  ["snabbt snabb quick enkelt enkel easy vardag", "simple mugcake stir snabb"],
  ["långkok slow", "slow bräser pulled dillkött"],
  ["tryckkokare", "tk tryckkokare"],
  ["asiatiskt asian", "asia"], ["italienskt italian", "italy"], ["franskt french", "france"],
  ["indiskt indian", "india"], ["mexikanskt mexican", "mexico"], ["amerikanskt american", "usa"],
  ["svenskt swedish nordiskt", "nordic"], ["engelskt english british", "england"], ["baka bakning baking", "bake"]
];
const STOP = new Set("med och i nagot jag vill ha till som en ett recept for mat pa lite av utan det att".split(" "));
const norm = s => s.toLowerCase().replace(/ø/g,"o").replace(/æ/g,"ae").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
const words = s => norm(s).split(" ").filter(Boolean);
const NORM_CONCEPTS = CONCEPTS.map(([a,t]) => [words(a), words(t)]);

function distance(a,b){
  let prev = Array.from({length:b.length+1},(_,i)=>i);
  for (let i=1;i<=a.length;i++){
    const row = [i];
    for (let j=1;j<=b.length;j++) row[j] = Math.min(prev[j]+1, row[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev = row;
  }
  return prev[b.length];
}
const allowedTypos = len => len<4 ? 0 : len<7 ? 1 : 2;
// How well one search word fits one word from a recipe: 1 is exact, 0 is no match.
function wordScore(q,w){
  if (q===w) return 1;
  if (w.startsWith(q)) return .85;
  if (q.length>=3 && w.includes(q)) return .7;
  const max = allowedTypos(q.length);
  if (max){
    const d = Math.min(distance(q,w), distance(q,w.slice(0,q.length)));
    let shared = 0; while (shared<q.length && q[shared]===w[shared]) shared++;
    if (shared>=4 && shared>=q.length-2) return .6;
    if (d<=max) return .65-d*.1-(q[0]===w[0]?0:.2);
  }
  return 0;
}
const bestScore = (q,list) => list.reduce((m,w)=>Math.max(m,wordScore(q,w)),0);
// Recipe text only counts on a clean match, so a typo can't pull in a recipe through an unrelated word in its method.
const bodyScore = (q,text) => q.length>=3 && text.includes(q) ? .7 : 0;
const termScore = (t,it) => Math.max(bestScore(t,it.titleWords), bestScore(t,it.tags)*.75, bestScore(t,it.placeWords)*.6, bodyScore(t,it.bodyText)*.5);
const termHits = t => INDEX.filter(it=>termScore(t,it)>0).length;
// A word with no matches is tried as a compound, so "potatissoppa" becomes "potatis soppa".
function splitCompound(t){
  if (t.length<7 || termHits(t)) return [t];
  let best = null, bestCount = 0;
  for (let i=3;i<=t.length-3;i++){
    const a = t.slice(0,i), b = t.slice(i), ca = termHits(a), cb = termHits(b);
    if (ca && cb && ca+cb>bestCount){ best = [a,b]; bestCount = ca+cb; }
  }
  return best || [t];
}

const INDEX = [];
(function walk(node,path){
  for (const s of node.sections) for (const row of s.rows){
    if (!Array.isArray(row)){ walk(row,[...path,row.title]); continue; }
    const r = recipeFor(row[1]);
    const place = [...path, s.name||""].join(" ");
    const body = r ? [...r.groups.flatMap(g=>g.items.map(i=>i[1])), ...r.method.flatMap(m=>m.steps), ...r.notes.flatMap(n=>n.lines)].join(" ").replace(/\[\[[0-9a-f]+\|([^\]]+)\]\]/g,"$1") : "";
    const hay = norm(`${row[0]} ${place} ${body}`);
    const hayWords = hay.split(" ");
    const tags = NORM_CONCEPTS.filter(([,t]) => t.some(x => x.length<=2 ? hayWords.includes(x) : hay.includes(x))).flatMap(([a])=>a);
    INDEX.push({ title:row[0], id:row[1], recipe:r, where:path.join(" / "), titleWords:words(row[0]), placeWords:words(place), bodyText:norm(body), tags });
  }
})(TREE,[]);

function search(q){
  const terms = words(q).filter(t=>!STOP.has(t)).flatMap(splitCompound);
  if (!terms.length) return [];
  const scored = INDEX.map(it => {
    let total = 0, hits = 0;
    for (const t of terms){
      const s = termScore(t,it);
      if (s>0){ hits++; total += s; }
    }
    return {it, hits, total};
  }).filter(x=>x.hits);
  const full = scored.filter(x=>x.hits===terms.length);
  return (full.length ? full : scored)
    .sort((a,b)=> b.total-a.total || (b.it.recipe?1:0)-(a.it.recipe?1:0))
    .slice(0,30).map(x=>x.it);
}

function findTrail(node,id,path=[node]){
  for (const s of node.sections) for (const row of s.rows){
    if (Array.isArray(row)){ if (row[1]===id) return path; }
    else { const hit = findTrail(row,id,[...path,row]); if (hit) return hit; }
  }
  return null;
}

// Keeps the screen on while a recipe is open, where the browser allows it. Fails silently otherwise.
async function requestWake(){
  if (wakeLock || !("wakeLock" in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch(e){}
}
function releaseWake(){ if (wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; } }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState==="visible" && recipe) requestWake();
});

document.addEventListener("click", e => {
  if (e.target===sheet) return closeSheet();
  const link = e.target.closest("[data-link]");
  if (link){
    const target = RECIPES.find(r=>r.id===link.dataset.link);
    cameFrom = [...cameFrom, recipe];
    return transition("f", () => showRecipe(target));
  }
  const stepEl = e.target.closest("[data-step]");
  if (stepEl) return toggleStep(stepEl);
  const t = e.target.closest("button");
  if (!t) return;
  const d = t.dataset;
  if ("appUpdate" in d) return updateApp(t);
  if ("searchClose" in d) closeSearch(true);
  else if (d.open){
    saveScroll();
    if (!panel.hidden){
      closeSearch(false);
      trail = findTrail(TREE,d.open) || [TREE];
    }
    transition("f", () => showRecipe(RECIPES.find(r=>r.id===d.open))); }
  else if (d.node){
    const [s,i] = d.node.split(".").map(Number);
    saveScroll();
    const next = trail[trail.length-1].sections[s].rows[i];
    next.scrollPos = 0;
    trail = [...trail, next];
    transition("f", showNode);
  }
  else if ("navSearch" in d) openSearch();
  else if ("navHome" in d){
    trail = [TREE]; TREE.scrollPos = 0; query = "";
    transition("b", showNode);
  }
  else if ("back" in d){ trail = trail.slice(0,-1); transition("b", showNode); }
  else if ("up" in d) goBack();
  else if ("sheet" in d) openSheet();
  else if ("close" in d) closeSheet();
  else if ("reset" in d){ store.del("done:"+recipe.id); showRecipe(recipe); }
});
document.addEventListener("keydown", e => {
  if ((e.target.id==="search" || e.target.id==="panel-search") && e.key==="Enter") return e.target.blur();
  if (!panel.hidden && e.key==="Escape") return closeSearch(true);
  if (!sheet.hidden && e.key==="Escape") return closeSheet();
  const stepEl = e.target.closest && e.target.closest("[data-step]");
  if (stepEl && (e.key==="Enter" || e.key===" ")){ e.preventDefault(); toggleStep(stepEl); }
});

// Fetches the newest code and recipes past the browser's cache, then reloads. If there's no connection the app stays as it is.
function updateWipe(x,y,opening){
  const wipe = document.createElement("div");
  wipe.className = "update-wipe";
  // Starts below the header, so the header and the status bar above it stay as they are.
  const bar = app.querySelector(".top-bar");
  const top = bar ? Math.round(bar.getBoundingClientRect().bottom) : 0;
  wipe.style.top = `${top}px`;
  const r = Math.ceil(Math.hypot(innerWidth,innerHeight));
  const circle = document.createElement("b");
  circle.style.cssText = `left:${x-r}px;top:${y-top-r}px;width:${r*2}px;height:${r*2}px;transform:scale(${opening?1:0})`;
  const word = document.createElement("span");
  word.textContent = "RECIPES";
  word.style.opacity = opening ? 1 : 0;
  wipe.append(circle,word);
  document.body.appendChild(wipe);
  const ease = "cubic-bezier(.65,0,.35,1)";
  const scales = [{transform:"scale(0)"},{transform:"scale(1)"}], fades = [{opacity:0},{opacity:1}];
  circle.animate(opening?scales:[...scales].reverse(),{duration:opening?420:380,easing:ease});
  word.animate(opening?fades:[...fades].reverse(),opening?{duration:200,delay:140,fill:"backwards"}:{duration:140});
  return wipe;
}
function closeWipe(x,y){
  const closing = updateWipe(x,y,false);
  setTimeout(() => closing.remove(),400);
}
async function updateApp(button){
  button.classList.add("updating");
  button.disabled = true;
  const box = button.getBoundingClientRect(), x = Math.round(box.left+box.width/2), y = Math.round(box.top+box.height/2);
  const motion = !reducedMotion();
  const wipe = motion ? updateWipe(x,y,true) : null;
  try {
    if (motion) await new Promise(done => setTimeout(done,520));
    const scripts = [...document.scripts].map(s=>s.src).filter(src=>src.startsWith(location.origin));
    const files = [location.href.split("#")[0], ...scripts, "apple-touch-icon.png"];
    await Promise.all(files.map(url => fetch(url,{cache:"reload"}).then(res => { if (!res.ok) throw new Error(url); })));
    if (motion) try { sessionStorage.setItem("updateWipe",JSON.stringify([x,y,Math.round(app.querySelector(".top-bar").getBoundingClientRect().bottom)])); } catch(e){}
    location.reload();
  } catch(e) {
    if (wipe){ wipe.remove(); closeWipe(x,y); }
    button.classList.remove("updating");
    button.disabled = false;
  }
}
// Swipe right to go back, as on iOS: the previous page sits underneath from the first movement.
// The current page follows the finger and the one below drifts in at a slower pace.
const canGoBack = () => !!recipe || trail.length>1;
function stepBack(){
  if (recipe && cameFrom.length){
    const previous = cameFrom[cameFrom.length-1];
    cameFrom = cameFrom.slice(0,-1);
    showRecipe(previous);
  }
  else if (recipe) showNode();
  else if (trail.length>1){ trail = trail.slice(0,-1); showNode(); }
}
function goBack(){ transition("b", stepBack); }
const PARALLAX = .28;
let swipe = null, swallowClick = false, swipeTop = null, swipeState = null;
function liftPage(){
  swipeState = { trail, recipe, cameFrom, done };
  clearTimeout(settleTimer);
  app.classList.remove("enter-f","enter-b");
  app.classList.add("settled","swiping");
  swipeTop = document.createElement("div");
  swipeTop.className = "view swipe-top";
  if (app.dataset.section) swipeTop.dataset.section = app.dataset.section;
  const scrolls = [...app.querySelectorAll(".scroll")].map(el=>el.scrollTop);
  while (app.firstChild) swipeTop.appendChild(app.firstChild);
  document.body.appendChild(swipeTop);
  swipeTop.querySelectorAll(".scroll").forEach((el,i)=>{ el.scrollTop = scrolls[i]; });
  stepBack();
}
function moveSwipe(dx){
  swipeTop.style.transform = `translateX(${dx}px)`;
  app.style.transform = `translateX(${-(1-dx/innerWidth)*PARALLAX*100}%)`;
}
function finishSwipe(commit, dx){
  const top = swipeTop, state = swipeState;
  swipeTop = null; swipeState = null;
  const remaining = commit ? innerWidth-dx : dx;
  const ms = Math.round(Math.max(120, Math.min(260, remaining/innerWidth*320)));
  const curve = `${ms}ms cubic-bezier(.2,.8,.2,1)`;
  top.style.transition = `transform ${curve}`;
  app.style.transition = `transform ${curve}`;
  void top.offsetWidth;
  top.style.transform = commit ? "translateX(100%)" : "translateX(0)";
  app.style.transform = commit ? "translateX(0)" : `translateX(${-PARALLAX*100}%)`;
  swipeBusy = true;
  setTimeout(() => {
    if (!commit){
      trail = state.trail; recipe = state.recipe; cameFrom = state.cameFrom; done = state.done;
      if (top.dataset.section) app.dataset.section = sheet.dataset.section = top.dataset.section;
      else { delete app.dataset.section; delete sheet.dataset.section; }
      const scrolls = [...top.querySelectorAll(".scroll")].map(el=>el.scrollTop);
      app.innerHTML = "";
      while (top.firstChild) app.appendChild(top.firstChild);
      app.querySelectorAll(".scroll").forEach((el,i)=>{ el.scrollTop = scrolls[i]; });
      if (recipe) requestWake();
    }
    top.remove();
    app.style.transition = app.style.transform = "";
    app.classList.remove("swiping");
    swipeBusy = false;
  }, ms+20);
}
let swipeBusy = false;
document.addEventListener("touchstart", e => {
  swipe = null;
  if (swipeBusy || e.touches.length!==1 || !sheet.hidden || !panel.hidden || !canGoBack()) return;
  const t = e.touches[0];
  swipe = { x:t.clientX, y:t.clientY, dx:0, active:false, lastX:t.clientX, lastTime:Date.now(), speed:0 };
}, {passive:true});
document.addEventListener("touchmove", e => {
  if (!swipe) return;
  const t = e.touches[0], dx = t.clientX-swipe.x, dy = t.clientY-swipe.y;
  if (!swipe.active){
    if (Math.abs(dx)<10 && Math.abs(dy)<10) return;
    if (dx<=0 || Math.abs(dy)>=dx){ swipe = null; return; }
    swipe.active = true;
    swipe.x = t.clientX;
    liftPage();
  }
  swipe.dx = Math.max(0,t.clientX-swipe.x);
  const now = Date.now();
  if (now>swipe.lastTime) swipe.speed = (t.clientX-swipe.lastX)/(now-swipe.lastTime);
  swipe.lastX = t.clientX; swipe.lastTime = now;
  moveSwipe(swipe.dx);
}, {passive:true});
function endSwipe(cancelled){
  if (!swipe || !swipe.active){ swipe = null; return; }
  const {dx} = swipe, speed = Date.now()-swipe.lastTime>80 ? 0 : swipe.speed;
  swipe = null;
  swallowClick = true;
  setTimeout(() => { swallowClick = false; }, 300);
  // Where the page would end up from its current speed decides the outcome, so a quick flick counts.
  finishSwipe(!cancelled && dx+speed*180>innerWidth*.5, dx);
}
document.addEventListener("touchend", () => endSwipe(false), {passive:true});
document.addEventListener("touchcancel", () => endSwipe(true), {passive:true});
document.addEventListener("click", e => {
  if (swallowClick){ e.stopPropagation(); e.preventDefault(); swallowClick = false; }
}, true);

const start = RECIPES.find(r=>r.id===location.hash.slice(1));
if (start){ trail = findTrail(TREE,start.notion.split("/").pop()) || [TREE]; showRecipe(start); }
else showNode();
settleApp();
try {
  const point = JSON.parse(sessionStorage.getItem("updateWipe"));
  sessionStorage.removeItem("updateWipe");
  if (point){
    // Starts shrinking only when the new page is done loading and drawing, so nothing competes with the motion.
    let started = false;
    const begin = () => {
      if (started) return;
      started = true;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        closeWipe(point[0],point[1]);
        document.documentElement.classList.remove("wipe-hold");
      }));
    };
    const ready = document.fonts ? document.fonts.ready : Promise.resolve();
    addEventListener("load", () => ready.then(begin));
    setTimeout(begin,1200);
    setTimeout(() => document.documentElement.classList.remove("wipe-hold"),1600);
  }
} catch(e){}
</script>
